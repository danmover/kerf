name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the desktop app's Electron binary isn't needed here; the Desktop app workflow downloads it
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    # the tests take 8 to 13 minutes depending on the runner
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  geom:
    name: Geometry core (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # the crates have no dependencies, so there is nothing to cache; the app's tests check that the committed
      # WebAssembly build (src/geom/kerf_geom.wasm) was made from these sources
      - run: cargo test --workspace
